<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engagement Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #fbf9f5;
      --card-bg: #ffffff;
      --gold: #c5a059;
      --gold-dark: #a27e36;
      --text-dark: #2c2a29;
      --text-muted: #6e6b67;
      --border-soft: #e8e2d5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-cream);
      font-family: 'Montserrat', sans-serif;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Container */
    .invitation-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      min-height: 620px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08), 0 5px 15px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border-soft);
      overflow: hidden;
    }

    /* ================= COVER OVERLAY ================= */
    .cover-overlay {
      position: absolute;
      inset: 0;
      background: #ffffff;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.8s ease;
    }

    .cover-overlay.opened {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .monogram-badge {
      width: 80px;
      height: 80px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      color: var(--gold-dark);
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(197, 160, 89, 0.15);
    }

    .cover-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .cover-subtitle {
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold-dark);
      margin-bottom: 40px;
    }

    .btn-open {
      padding: 14px 32px;
      background-color: var(--gold);
      color: #ffffff;
      border: none;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.35);
      transition: all 0.3s ease;
      position: relative;
      z-index: 20; /* Ensures clickability */
    }

    .btn-open:hover {
      background-color: var(--gold-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(197, 160, 89, 0.45);
    }

    .btn-open:active {
      transform: translateY(0);
    }

    /* ================= MAIN INVITATION CONTENT ================= */
    .card-content {
      padding: 50px 30px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
    }

    .cover-overlay.opened + .card-content {
      opacity: 1;
      transform: scale(1);
    }

    .header-script {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-style: italic;
      color: var(--gold-dark);
      margin-bottom: 8px;
    }

    .main-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .hosts-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .names-section {
      margin: 10px 0 28px;
    }

    .couple-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.3rem;
      font-weight: 600;
      color: var(--text-dark);
    }

    .ampersand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-style: italic;
      color: var(--gold);
      margin: 4px 0;
    }

    .divider-line {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 20px auto;
    }

    .details-box {
      margin-top: 10px;
      line-height: 1.8;
    }

    .date-text {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-dark);
    }

    .time-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .venue-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gold-dark);
    }

    .venue-address {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Music Control Button */
    .music-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border-soft);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      z-index: 15;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

  <!-- Background Audio (Replace source with your audio file or keep default) -->
  <audio id="bgMusic" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-ambient-111306.mp3" type="audio/mpeg">
  </audio>

  <div class="invitation-container">
    
    <!-- Music Button -->
    <button class="music-toggle" id="musicBtn" title="Toggle Music">🎵</button>

    <!-- Cover / Envelope Layer -->
    <div class="cover-overlay" id="cover">
      <div class="monogram-badge">S & A</div>
      <h1 class="cover-title">Engagement</h1>
      <p class="cover-subtitle">Invitation</p>
      <button class="btn-open" id="openBtn">Open Invitation</button>
    </div>

    <!-- Inside Card Details -->
    <div class="card-content">
      <p class="header-script">Together with our families</p>
      <h2 class="main-heading">Engagement Ceremony</h2>

      <div class="names-section">
        <div class="couple-name">Sarang</div>
        <div class="ampersand">&</div>
        <div class="couple-name">Apurva</div>
      </div>

      <div class="divider-line"></div>

      <div class="details-box">
        <p class="date-text">Saturday, October 24, 2026</p>
        <p class="time-text">6:00 PM Onwards</p>
        <div class="venue-title">Venue Details</div>
        <p class="venue-address">
          Grand Celebration Hall<br>
          Kothrud, Pune, Maharashtra
        </p>
      </div>
    </div>

  </div>

  <script>
    const openBtn = document.getElementById('openBtn');
    const cover = document.getElementById('cover');
    const bgMusic = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');

    let isMusicPlaying = false;

    function openInvitation() {
      // 1. Immediately slide open the cover
      cover.classList.add('opened');

      // 2. Play audio safely inside a try/catch & promise catch
      if (bgMusic) {
        bgMusic.play()
          .then(() => {
            isMusicPlaying = true;
            musicBtn.textContent = '⏸';
          })
          .catch((err) => {
            // Browser autoplay restrictions blocked it; visual reveal still functions smoothly
            console.warn('Audio play restricted or unavailable:', err);
            isMusicPlaying = false;
            musicBtn.textContent = '▶';
          });
      }
    }

    // Toggle button for manual music control
    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!bgMusic) return;

      if (isMusicPlaying) {
        bgMusic.pause();
        musicBtn.textContent = '▶';
        isMusicPlaying = false;
      } else {
        bgMusic.play().then(() => {
          musicBtn.textContent = '⏸';
          isMusicPlaying = true;
        }).catch(err => console.warn(err));
      }
    });

    // Primary click trigger
    openBtn.addEventListener('click', openInvitation);
  </script>
</body>
</html>
